spring:
  task:
    scheduling:
      pool:
        size: 4
  datasource:
    url: jdbc:h2:mem:tasktest;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
tg:
  jwt:
    secret: unit-test-jwt-secret-key-32-bytes-ok!!!
  internal-token: test-internal-token
  task:
    ttl-seconds: 86400
    max-attempts: 3
    sweep-interval-ms: 300
    outbox-interval-ms: 300
    webhook-interval-ms: 300
    engine:
      latency-ms: 100
      fail-rate: 0.0
