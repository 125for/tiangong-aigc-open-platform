server:
  port: 8081
  shutdown: graceful
spring:
  application:
    name: tg-account
  profiles:
    default: local
  lifecycle:
    timeout-per-shutdown-phase: 30s
  jpa:
    hibernate:
      ddl-auto: validate      # 结构由 Flyway 唯一管理
    open-in-view: false
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [trace:%X{traceId:-}] %logger{24} - %msg%n"
tg:
  jwt:
    secret: ${TG_JWT_SECRET:tiangong-dev-only-jwt-secret-key-32bytes!}
    access-ttl-seconds: 1800
    refresh-ttl-days: 7
  aes-key: ${TG_AES_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
  internal-token: ${TG_INTERNAL_TOKEN:dev-internal-token}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:file:./data/account;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:3306/tg_account?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:tiangong}
    password: ${MYSQL_PASSWORD:tiangong123}
    driver-class-name: com.mysql.cj.jdbc.Driver
